services:
  honeypot:
    build: .
    container_name: honeypot_app
    restart: always
    ports:
      - "22:2222"   # SSH
      - "23:2223"   # Telnet
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  honeynet:
    driver: bridge