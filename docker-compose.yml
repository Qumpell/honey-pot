services:
  honeypot:
    build: .
    container_name: honeypot_app
    restart: always
    ports:
      - "22:2222"   # SSH
      - "23:2223"   # Telnet
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  prometheus:
    image: prom/prometheus:latest
    container_name: honeypot_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - honeynet

  grafana:
    image: grafana/grafana:latest
    container_name: honeypot_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - TZ=Europe/Warsaw
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml
      - ./grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana/dashboards/honeypot.json:/etc/grafana/provisioning/dashboards/honeypot.json
    networks:
          - honeynet
networks:
  honeynet:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: